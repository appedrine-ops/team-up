<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#111b21">
<title>TEAM-UP — Chat together</title>
<meta name="description" content="TEAM-UP: real-time chat with private messages, file sharing, voice notes, voice and video calls.">
<style>
:root{--brand:#20c875;--brand-d:#16a765;--ink:#e9edef;--muted:#9aa4a9;--line:#263238;--bg:#0b141a;--panel:#111b21;--card:#202c33;--card2:#2a3942;--mine:#005c4b;--danger:#ef4444}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{margin:0;font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--ink);overflow:hidden}
button,input,textarea{font:inherit;color:inherit}button{cursor:pointer;border:0;background:none}
[hidden]{display:none!important}
.spacer{flex:1}
.app{height:100dvh;display:grid;grid-template-columns:370px minmax(0,1fr);max-width:1600px;margin:auto;background:var(--panel)}
/* panel */
.panel{display:flex;flex-direction:column;border-right:1px solid var(--line);min-height:0;min-width:0}
.panel-head{display:flex;align-items:center;padding:16px 16px 10px;gap:10px}
.brand{display:flex;align-items:center;gap:10px;font-size:21px;font-weight:850;letter-spacing:-.6px}
.brand-mark{width:36px;height:36px;border-radius:12px;display:grid;place-items:center;background:linear-gradient(135deg,#20c875,#0b9d62);color:#062c1b;font-weight:900}
.me{border-radius:50%}
.avatar{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:800;flex:none;position:relative;background:#087e68;user-select:none}
.avatar.small{width:36px;height:36px;font-size:13px}.avatar.big{width:120px;height:120px;font-size:48px}
.avatar .dot{position:absolute;right:-1px;bottom:-1px;width:11px;height:11px;border-radius:50%;background:var(--brand);border:2px solid var(--panel)}
.tabs{display:flex;gap:6px;padding:4px 14px 10px}
.tabs button{flex:1;padding:9px 6px;border-radius:99px;background:var(--card);color:#b8c3c8;font-weight:700;font-size:13px}
.tabs button.on{background:#0f3d2f;color:#42d692}
.tab{display:none;flex:1;min-height:0;overflow:auto;padding:0 8px 14px}.tab.on{display:block}
.search{display:flex;gap:8px;align-items:center;background:var(--card);padding:10px 14px;border-radius:12px;margin:4px 6px 8px}
.search input{border:0;outline:0;background:transparent;width:100%;font-size:14px}
.contact{display:flex;align-items:center;gap:12px;padding:10px 10px;width:100%;text-align:left;border-radius:12px}
.contact:hover{background:#1b292f}.contact.active{background:#1f302b}
.contact-info{min-width:0;flex:1}.contact-info strong,.contact-info small{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.contact-info strong{font-size:14px}.contact-info small{font-size:12px;color:var(--muted);margin-top:3px}.contact-info small.missed{color:#ff8a8a}
.callbtn{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;color:var(--brand);font-size:17px}.callbtn:hover{background:var(--card)}
.empty{text-align:center;color:var(--muted);font-size:13px;padding:30px 16px;line-height:1.6}
.label{font-size:11px;text-transform:uppercase;letter-spacing:1.1px;color:#829198;font-weight:800;padding:10px 12px 4px}
/* chat */
.chat{display:flex;flex-direction:column;min-width:0;min-height:0;height:100dvh;position:relative;background:var(--bg)}
.topbar{height:68px;flex:none;display:flex;align-items:center;gap:12px;padding:0 14px;background:var(--panel);border-bottom:1px solid var(--line)}
.who{min-width:0}.who h1{font-size:16px;margin:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.who p{margin:3px 0 0;font-size:12px;color:var(--muted)}
.icon-btn{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:var(--card);font-size:17px;flex:none}.icon-btn:hover{background:var(--card2);color:#42d692}
.back{display:none}
.messages{flex:1;overflow:auto;padding:16px clamp(12px,3vw,40px);background-image:radial-gradient(circle at 20px 20px,#18252c 1.2px,transparent 1.5px),radial-gradient(circle at 70px 65px,#16232a 1px,transparent 1.4px);background-size:100px 100px;scroll-behavior:smooth}
.message-row{display:flex;gap:8px;align-items:flex-end;margin:6px 0}.message-row.mine{justify-content:flex-end}
.bubble-wrap{max-width:min(78%,480px);min-width:0}
.sender{font-size:11px;color:#43d69a;margin:0 0 4px 4px;font-weight:700}
.bubble{padding:8px 11px 6px;border-radius:10px 10px 10px 3px;background:var(--card);line-height:1.45;font-size:14.5px;overflow-wrap:anywhere;white-space:pre-wrap;cursor:pointer}
.mine .bubble{background:var(--mine);border-radius:10px 10px 3px 10px}
.bubble .lnk{color:#6ec6ff}
.meta{display:flex;justify-content:flex-end;gap:5px;font-size:10px;color:#a6b4ba;margin-top:3px;white-space:normal}
.quote{border-left:3px solid var(--brand);background:#0003;border-radius:6px;padding:5px 8px;margin:0 0 6px;font-size:12px}.quote b{display:block;color:#43d69a;font-size:11px}.quote span{display:block;color:#c3ced3;max-height:34px;overflow:hidden}
.reactions{display:flex;flex-wrap:wrap;gap:4px;margin:3px 2px}.chip{background:var(--card2);border-radius:99px;padding:2px 8px;font-size:12px}.chip.mine{background:#0f4a3b;outline:1px solid var(--brand)}
.actions{display:none;gap:4px;flex-wrap:wrap;margin:5px 0 2px;background:#1a2830;border:1px solid var(--line);border-radius:14px;padding:5px;width:max-content;max-width:100%}
.sel .actions{display:flex}.mine .actions{margin-left:auto}
.actions button{padding:5px 8px;border-radius:9px;font-size:15px}.actions button:hover{background:var(--card2)}.actions .txt{font-size:12px;font-weight:700;color:#c8d1d5}
.voice{display:flex;align-items:center;gap:8px;min-width:230px}.voice audio{height:36px;width:100%;max-width:260px}
.media-img{display:block;max-width:100%;max-height:300px;border-radius:8px;cursor:zoom-in;background:#0003}
.media-video{display:block;max-width:100%;max-height:320px;border-radius:8px;background:#000}
.file-card{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:10px;background:#0003;color:inherit;text-decoration:none;min-width:200px}
.file-card .ico{font-size:26px}.file-card strong{display:block;font-size:13px;overflow-wrap:anywhere}.file-card small{display:block;font-size:11px;opacity:.75;margin-top:2px}
.dropzone{position:absolute;inset:68px 0 0 0;background:#0b141aee;border:2px dashed var(--brand);display:none;place-items:center;font-size:20px;font-weight:700;color:#42d692;z-index:5}.dropzone.on{display:grid}
.reply-bar{display:flex;align-items:center;gap:10px;padding:8px 14px;background:var(--panel);border-top:1px solid var(--line);font-size:12px}
.reply-bar div{flex:1;min-width:0;border-left:3px solid var(--brand);padding-left:8px}.reply-bar b{color:#43d69a;display:block}.reply-bar span{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:#b8c3c8}
.upload-bar{padding:8px 16px;background:var(--panel);font-size:12px;color:#42d692}.bar{height:4px;background:var(--card);border-radius:4px;margin-top:5px;overflow:hidden}.bar i{display:block;height:100%;width:0;background:var(--brand);transition:width .15s}
.composer-wrap{flex:none;padding:8px 10px max(10px,env(safe-area-inset-bottom));background:var(--panel);border-top:1px solid var(--line);position:relative}
.composer{display:flex;align-items:flex-end;gap:4px;background:var(--card);border-radius:26px;padding:5px 6px 5px 8px}
.composer textarea{flex:1;min-width:0;border:0;outline:0;resize:none;background:transparent;max-height:120px;padding:10px 4px;font-size:15px}
.composer textarea::placeholder{color:#86949b}
.tool{width:38px;height:38px;border-radius:50%;font-size:20px;color:#aebac0;display:grid;place-items:center;flex:none}.tool:hover{background:#2a3942;color:#42d692}
.send{width:42px;height:42px;border-radius:50%;background:var(--brand);color:#062c1b;font-size:17px;display:grid;place-items:center;flex:none}.send:hover{background:#42d692}
.composer .send{display:none}.composer.has-text .send{display:grid}.composer.has-text #micBtn{display:none}
.recbar{display:flex;align-items:center;gap:12px;background:var(--card);border-radius:26px;padding:5px 6px 5px 10px}
.record-dot{width:10px;height:10px;border-radius:50%;background:#ff4d4f;animation:pulse 1s infinite}@keyframes pulse{50%{opacity:.25}}
.pop{position:absolute;bottom:calc(100% + 6px);left:10px;background:#1a2830;border:1px solid var(--line);border-radius:16px;padding:8px;box-shadow:0 10px 30px #0008;z-index:10}
.attach-menu{display:flex;flex-direction:column;min-width:190px}.attach-menu button{display:flex;gap:12px;align-items:center;text-align:left;padding:11px 12px;border-radius:10px;font-size:14px}.attach-menu button:hover{background:var(--card2)}
.emoji-panel{display:grid;grid-template-columns:repeat(8,1fr);gap:2px;width:min(340px,calc(100vw - 30px))}.emoji-panel button{font-size:22px;padding:5px;border-radius:8px}.emoji-panel button:hover{background:var(--card2)}
.menu{position:absolute;right:14px;top:62px;min-width:210px;background:#1a2830;border:1px solid var(--line);border-radius:14px;padding:6px;z-index:30;box-shadow:0 10px 30px #0008}
.menu button,.menu div{display:block;width:100%;text-align:left;padding:10px 12px;border-radius:9px;font-size:14px}.menu button:hover{background:var(--card2)}.menu div{color:var(--muted);font-size:12px;overflow:hidden;text-overflow:ellipsis}
/* auth */
.overlay{position:fixed;inset:0;display:grid;place-items:center;padding:16px;z-index:60}
.auth{background:#061014f2}
.card{width:min(100%,420px);background:var(--panel);border:1px solid var(--line);border-radius:22px;padding:26px;box-shadow:0 25px 80px #000a;max-height:94dvh;overflow:auto}
.card h2{margin:14px 0 6px;font-size:24px}.card p{color:#aab6bb;font-size:13px;line-height:1.5;margin:0 0 12px}
.card label{font-size:12px;color:#aab6bb}.card input{width:100%;padding:12px;background:var(--card);border:1px solid #34434b;border-radius:10px;margin:5px 0 10px;outline:0}.card input:focus{border-color:var(--brand)}
.btn{padding:11px 16px;border-radius:10px;background:var(--brand);color:#062c1b;font-weight:800}.btn.sec{background:#1f302b;color:#42d692}
.google-btn{width:100%;display:flex;justify-content:center;gap:10px;margin:8px 0 12px;background:var(--card);border:1px solid #34434b;padding:12px;border-radius:10px;font-weight:700}
.auth-actions{display:flex;gap:8px;flex-wrap:wrap}.auth-error{color:#ff9c9c;font-size:12px;min-height:16px;margin-top:10px}.linkish{color:#42d692;font-size:12px;text-decoration:underline;margin-top:6px}
.or{display:flex;align-items:center;gap:10px;color:#829198;font-size:11px;margin:2px 0 12px}.or i{height:1px;background:var(--line);flex:1}
/* calls */
.incoming{background:#061014ee;z-index:80}
.incoming .card{text-align:center;display:flex;flex-direction:column;align-items:center;gap:6px}
.ring-actions{display:flex;gap:40px;margin-top:20px}
.round{width:64px;height:64px;border-radius:50%;font-size:26px;display:grid;place-items:center;color:#fff}.round.red{background:var(--danger)}.round.green{background:#16a34a;animation:bounce 1.1s infinite}
@keyframes bounce{50%{transform:scale(1.1)}}
.call-overlay{position:fixed;inset:0;background:radial-gradient(circle at 50% 30%,#12302a,#0b141a 70%);z-index:90;display:none;flex-direction:column;align-items:center;justify-content:center;overflow:hidden}
.call-overlay.show{display:flex}
#remoteVideo{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;background:#000}
.call-overlay.audio #remoteVideo{opacity:0;width:1px;height:1px}
.call-overlay.video .call-center{display:none}.call-overlay.video.remote-on .call-center{display:none}
.call-overlay.video:not(.remote-on) #remoteVideo{opacity:0}
.call-overlay.video:not(.remote-on) .call-center{display:flex}
.call-center{position:relative;flex-direction:column;align-items:center;gap:10px;text-align:center;z-index:2;display:flex}
.call-center h2{margin:12px 0 0;font-size:26px}.call-center p{margin:0;color:#b8c3c8}
.call-top{position:absolute;top:max(16px,env(safe-area-inset-top));left:0;right:0;text-align:center;z-index:3;text-shadow:0 1px 6px #000a}
.call-top strong{display:block;font-size:17px}.call-top span{font-size:13px;opacity:.85}
.call-overlay.audio .call-top{display:none}
#localVideo{position:absolute;right:14px;top:max(70px,calc(env(safe-area-inset-top) + 60px));width:110px;height:150px;object-fit:cover;border-radius:14px;background:#111;border:2px solid #fff3;z-index:4;transform:scaleX(-1)}
.call-overlay.audio #localVideo{display:none}
.call-controls{position:absolute;bottom:max(26px,env(safe-area-inset-bottom));display:flex;gap:16px;z-index:5;flex-wrap:wrap;justify-content:center;padding:0 12px}
.cbtn{width:58px;height:58px;border-radius:50%;background:#ffffff26;backdrop-filter:blur(8px);font-size:22px;display:grid;place-items:center;color:#fff}.cbtn.off{background:#fff;color:#111}.cbtn.end{background:var(--danger)}
.call-overlay.audio .video-only{display:none}
.lightbox{background:#000e;z-index:100;cursor:zoom-out}.lightbox img{max-width:100%;max-height:100%;border-radius:8px}
.toast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,20px);background:var(--card2);color:var(--ink);padding:11px 16px;border-radius:12px;font-size:13px;opacity:0;pointer-events:none;transition:.2s;z-index:200;max-width:90vw;text-align:center}.toast.show{opacity:1;transform:translate(-50%,0)}
.file-row{display:flex;gap:12px;align-items:center;padding:10px;border-radius:12px;color:inherit;text-decoration:none}.file-row:hover{background:#1b292f}.file-row .ico{font-size:24px}.file-row strong{font-size:13px;display:block;overflow-wrap:anywhere}.file-row small{font-size:11px;color:var(--muted)}
@media(max-width:820px){
  .app{display:block}.panel,.chat{height:100dvh}
  .app[data-view=list] .chat{display:none}.app[data-view=chat] .panel{display:none}
  .back{display:grid}.bubble-wrap{max-width:86%}
  #localVideo{width:92px;height:128px}
}
</style>
</head>
<body>
<div class="app" id="app" data-view="list">
  <aside class="panel">
    <div class="panel-head">
      <div class="brand"><div class="brand-mark">T</div>TEAM-UP</div>
      <div class="spacer"></div>
      <button class="me" id="meBtn" aria-label="Account menu"><span class="avatar small" id="meAvatar">?</span></button>
    </div>
    <nav class="tabs" id="tabs">
      <button data-tab="chats" class="on">Chats</button>
      <button data-tab="calls">Calls</button>
      <button data-tab="files">Files</button>
    </nav>
    <section class="tab on" id="tab-chats">
      <label class="search"><span>⌕</span><input id="searchInput" placeholder="Search people" aria-label="Search people"></label>
      <div id="contacts"></div>
    </section>
    <section class="tab" id="tab-calls"><div id="callList"></div></section>
    <section class="tab" id="tab-files"><div id="fileList"></div></section>
  </aside>

  <main class="chat" id="chat">
    <header class="topbar">
      <button class="icon-btn back" id="backBtn" aria-label="Back">‹</button>
      <div class="avatar small" id="activeAvatar">#</div>
      <div class="who"><h1 id="chatName">General room</h1><p id="chatStatus"></p></div>
      <div class="spacer"></div>
      <button class="icon-btn" id="voiceCall" title="Voice call" aria-label="Voice call">📞</button>
      <button class="icon-btn" id="videoCall" title="Video call" aria-label="Video call">🎥</button>
    </header>
    <section class="messages" id="messages" aria-live="polite">
      <div id="list"></div>
      <div class="empty" id="emptyNote" hidden>No messages yet. Say hello 👋</div>
    </section>
    <div class="dropzone" id="dropzone">Drop files to share</div>
    <div class="reply-bar" id="replyBar" hidden><div><b id="replyName"></b><span id="replyText"></span></div><button class="tool" id="replyCancel" type="button" aria-label="Cancel reply">✕</button></div>
    <div class="upload-bar" id="uploadBar" hidden><span id="uploadLabel"></span><div class="bar"><i id="uploadFill"></i></div></div>
    <form class="composer-wrap" id="messageForm" autocomplete="off">
      <div class="pop attach-menu" id="attachMenu" hidden>
        <button type="button" data-pick="media">🖼️ Photo or video</button>
        <button type="button" data-pick="camera">📷 Camera</button>
        <button type="button" data-pick="doc">📄 Document</button>
      </div>
      <div class="pop emoji-panel" id="emojiPanel" hidden></div>
      <div class="composer" id="composer">
        <button class="tool" type="button" id="attachBtn" title="Attach" aria-label="Attach">＋</button>
        <button class="tool" type="button" id="emojiBtn" title="Emoji" aria-label="Emoji">☺</button>
        <textarea id="messageInput" rows="1" placeholder="Message" aria-label="Write a message"></textarea>
        <button class="tool" type="button" id="micBtn" title="Record voice note" aria-label="Record voice note">🎙</button>
        <button class="send" type="submit" aria-label="Send message">➤</button>
      </div>
      <div class="recbar" id="recBar" hidden>
        <button class="tool" type="button" id="recCancel" aria-label="Cancel recording">🗑</button>
        <span class="record-dot"></span><span id="recTime">0:00</span>
        <span class="spacer"></span>
        <button class="send" type="button" id="recSend" aria-label="Send voice note" style="display:grid">➤</button>
      </div>
      <input type="file" id="fileMedia" hidden multiple accept="image/*,video/*">
      <input type="file" id="fileCamera" hidden accept="image/*,video/*" capture="environment">
      <input type="file" id="fileDoc" hidden multiple accept=".pdf,.doc,.docx,.txt,.ppt,.pptx,.xls,.xlsx,.csv,.zip,.rtf,audio/*">
    </form>
  </main>
</div>

<div class="menu" id="meMenu" hidden></div>

<!-- sign-in -->
<div class="overlay auth" id="authOverlay">
  <section class="card" aria-labelledby="authTitle">
    <div class="brand"><div class="brand-mark">T</div>TEAM-UP</div>
    <h2 id="authTitle">Welcome to TEAM-UP</h2>
    <p>Chat, share files, send voice notes and call your people. Sign in to get started.</p>
    <button id="googleSignInBtn" class="google-btn" type="button"><b style="color:#4285f4">G</b> Continue with Google</button>
    <div class="or"><i></i>OR USE EMAIL<i></i></div>
    <label for="authName">Display name (for new accounts)</label><input id="authName" autocomplete="name" placeholder="Your name">
    <label for="authEmail">Email address</label><input id="authEmail" type="email" autocomplete="email" placeholder="you@example.com">
    <label for="authPassword">Password</label><input id="authPassword" type="password" autocomplete="current-password" placeholder="At least 6 characters">
    <div class="auth-actions"><button id="signInBtn" class="btn" type="button">Sign in</button><button class="btn sec" id="signUpBtn" type="button">Create account</button></div>
    <button class="linkish" id="resetBtn" type="button">Forgot password?</button>
    <p class="auth-error" id="authError" role="alert"></p>
  </section>
</div>

<!-- incoming call -->
<div class="overlay incoming" id="incoming" hidden>
  <section class="card">
    <div class="avatar big" id="incAvatar">?</div>
    <h2 id="incName">Someone</h2>
    <p id="incType">Incoming call…</p>
    <div class="ring-actions">
      <button class="round red" id="declineBtn" aria-label="Decline">✕</button>
      <button class="round green" id="acceptBtn" aria-label="Accept">📞</button>
    </div>
  </section>
</div>

<!-- active call -->
<div class="call-overlay" id="callOverlay">
  <video id="remoteVideo" autoplay playsinline></video>
  <video id="localVideo" autoplay playsinline muted></video>
  <div class="call-top"><strong id="callTopName"></strong><span id="callTopStatus"></span></div>
  <div class="call-center"><div class="avatar big" id="callAvatar">?</div><h2 id="callName"></h2><p id="callStatus">Calling…</p></div>
  <div class="call-controls">
    <button class="cbtn" id="muteBtn" aria-label="Mute microphone" title="Mute">🎤</button>
    <button class="cbtn video-only" id="camBtn" aria-label="Turn camera off" title="Camera">📹</button>
    <button class="cbtn video-only" id="screenBtn" aria-label="Share screen" title="Share screen">🖥</button>
    <button class="cbtn end" id="hangBtn" aria-label="End call" title="End call">📵</button>
  </div>
</div>

<div class="overlay lightbox" id="lightbox" hidden><img id="lightboxImg" alt=""></div>
<div class="toast" id="toast" role="status"></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/13.0.0/firebase-app.js";
import { getAuth, GoogleAuthProvider, signInWithPopup, createUserWithEmailAndPassword, signInWithEmailAndPassword, onAuthStateChanged, updateProfile, signOut, sendPasswordResetEmail } from "https://www.gstatic.com/firebasejs/13.0.0/firebase-auth.js";
import { getFirestore, collection, doc, addDoc, setDoc, updateDoc, deleteDoc, query, where, orderBy, limitToLast, limit, onSnapshot, serverTimestamp, arrayUnion, arrayRemove, FieldPath } from "https://www.gstatic.com/firebasejs/13.0.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyDV1olfRP0Q7QQeswqRDWF-rZAGnGoEYiM",
  authDomain: "team-up-chat.firebaseapp.com",
  projectId: "team-up-chat",
  storageBucket: "team-up-chat.firebasestorage.app",
  messagingSenderId: "473620469400",
  appId: "1:473620469400:web:8117b6d554548caa3522ed"
};

// WebRTC servers. STUN finds a direct path; TURN relays media when networks (e.g. mobile carriers) block direct paths.
// The Open Relay entry is a free shared server for testing — replace it with your own TURN credentials for production.
const ICE = { iceServers: [
  { urls: ['stun:stun.l.google.com:19302', 'stun:stun1.l.google.com:19302'] },

// FILE STORAGE — both options are free and need no credit card.
// Option A (works right now, no setup): files are stored inside Firestore. Photos are auto-compressed; limit ~600 KB per file.

const CLOUDINARY = { cloudName: '', uploadPreset: '' };
const INLINE_MAX = 600 * 1024;
const MAX_CLOUD = 100 * 1024 * 1024;
const ONLINE_MS = 75000;

/* ---------- helpers ---------- */
const $ = id => document.getElementById(id);
const el = (tag, cls, text) => { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; };
const hue = s => { let h = 0; for (const c of (s || '?')) h = (h * 31 + c.charCodeAt(0)) % 360; return h; };
function paintAvatar(node, name) {
  node.textContent = (name || '?').trim().slice(0, 1).toUpperCase() || '?';
  const h = hue(name); node.style.background = `linear-gradient(135deg,hsl(${h} 55% 34%),hsl(${(h + 40) % 360} 60% 44%))`;
}
let toastTimer;
function toast(t) { const n = $('toast'); n.textContent = t; n.classList.add('show'); clearTimeout(toastTimer); toastTimer = setTimeout(() => n.classList.remove('show'), 3000); }
const fmtTime = d => d.toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' });
function fmtStamp(ts) {
  if (!ts?.toDate) return '';
  const d = ts.toDate(), now = new Date();
  return d.toDateString() === now.toDateString() ? fmtTime(d) : d.toLocaleDateString([], { month: 'short', day: 'numeric' }) + ' ' + fmtTime(d);
}
const fmtDur = s => `${Math.floor(s / 60)}:${String(Math.floor(s % 60)).padStart(2, '0')}`;
const fmtSize = b => b >= 1048576 ? (b / 1048576).toFixed(1) + ' MB' : Math.max(1, Math.round(b / 1024)) + ' KB';
const isOnline = u => !!u?.lastSeen?.toMillis && Date.now() - u.lastSeen.toMillis() < ONLINE_MS;
function lastSeenText(u) {
  if (isOnline(u)) return 'Online';
  const ms = u?.lastSeen?.toMillis?.(); if (!ms) return 'Offline';
  const m = Math.round((Date.now() - ms) / 60000);
  if (m < 60) return `Last seen ${Math.max(m, 1)} min ago`;
  if (m < 1440) return `Last seen ${Math.round(m / 60)} h ago`;
  return 'Last seen ' + new Date(ms).toLocaleDateString([], { month: 'short', day: 'numeric' });
}
function linkify(node, text) {
  const re = /(https?:\/\/[^\s<]+)/g; let last = 0, m;
  while ((m = re.exec(text))) {
    if (m.index > last) node.append(text.slice(last, m.index));
    const a = el('a', 'lnk', m[0]); a.href = m[0]; a.target = '_blank'; a.rel = 'noopener noreferrer'; node.append(a);
    last = m.index + m[0].length;
  }
  if (last < text.length) node.append(text.slice(last));
}
const SAFE_URL = /^(https:\/\/|data:(image\/(png|jpe?g|webp|gif)|audio\/[\w.+-]+|video\/[\w.+-]+|application\/(pdf|zip|msword|octet-stream|vnd[\w.+-]+)|text\/plain)[;,])/i;
const safeUrl = u => typeof u === 'string' && SAFE_URL.test(u);
const dmId = (a, b) => [a, b].sort().join('_');
const msgCol = id => id === 'general' ? collection(db, 'rooms', 'general', 'messages') : collection(db, 'chats', id, 'messages');

function teardown() {
  [unsubMsgs, unsubUsers, unsubCalls, unsubIncoming].forEach(u => u && u()); unsubMsgs = unsubUsers = unsubCalls = unsubIncoming = null;
  clearInterval(heartbeat); clearInterval(refresher);
  if (call) endCall(true); hideIncoming();
  users.clear(); callsData = []; $('list').innerHTML = ''; $('contacts').innerHTML = '';
}

async function beat() {
  if (!me) return;
  try { await setDoc(doc(db, 'users', me.uid), { displayName: me.displayName || me.email, email: me.email || '', photoURL: me.photoURL || '', lastSeen: serverTimestamp() }, { merge: true }); } catch (e) { console.warn('presence', e.code); }
}

function startSession() {
  beat(); heartbeat = setInterval(beat, 30000);
  document.addEventListener('visibilitychange', () => { if (!document.hidden) beat(); });
  refresher = setInterval(() => { renderContacts(); renderHeader(); }, 30000);
  unsubUsers = onSnapshot(collection(db, 'users'), snap => {
    users.clear(); snap.forEach(d => users.set(d.id, { id: d.id, ...d.data({ serverTimestamps: 'estimate' }) }));
    renderContacts(); renderHeader();
  }, err => { console.error(err); toast('Could not load people. Check Firestore rules.'); });
  unsubCalls = onSnapshot(query(collection(db, 'calls'), where('participants', 'array-contains', me.uid), limit(60)), snap => {
    callsData = snap.docs.map(d => ({ id: d.id, ...d.data({ serverTimestamps: 'estimate' }) })).sort((a, b) => (b.createdAt?.toMillis?.() || 0) - (a.createdAt?.toMillis?.() || 0));
    renderCalls();
  }, err => console.warn('calls history', err.code));
  listenIncoming();
  openChat('general', null, false);
}

/* ---------- contacts ---------- */
function renderContacts() {
  const box = $('contacts'); const q = $('searchInput').value.trim().toLowerCase();
  box.innerHTML = '';
  const onlineCount = [...users.values()].filter(u => u.id !== me?.uid && isOnline(u)).length;
  if (!q || 'general room'.includes(q)) {
    const b = el('button', 'contact' + (active.id === 'general' ? ' active' : ''));
    const av = el('div', 'avatar'); av.textContent = '#'; av.style.background = 'linear-gradient(135deg,#087e68,#20c875)';
    const info = el('span', 'contact-info'); info.append(el('strong', null, 'General room'), el('small', null, `Everyone · ${onlineCount} online`));
    b.append(av, info); b.onclick = () => openChat('general', null, true); box.append(b);
  }
  const list = [...users.values()].filter(u => u.id !== me?.uid && (u.displayName || u.email || '').toLowerCase().includes(q))
    .sort((a, b) => (isOnline(b) - isOnline(a)) || (a.displayName || '').localeCompare(b.displayName || ''));
  if (list.length) box.append(el('div', 'label', 'People'));
  list.forEach(u => {
    const id = dmId(me.uid, u.id);
    const b = el('button', 'contact' + (active.id === id ? ' active' : ''));
    const av = el('div', 'avatar'); paintAvatar(av, u.displayName); if (isOnline(u)) av.append(el('i', 'dot'));
    const info = el('span', 'contact-info'); info.append(el('strong', null, u.displayName || u.email || 'User'), el('small', null, lastSeenText(u)));
    b.append(av, info); b.onclick = () => openChat(id, u, true); box.append(b);
  });

$('searchInput').addEventListener('input', renderContacts);

  else { paintAvatar(av, name); $('chatStatus').textContent = lastSeenText(active.peer); }

/* ---------- open chat + messages ---------- */
function openChat(id, peer, showChat) {
  active = { id, peer };
  if (unsubMsgs) unsubMsgs();
  $('list').innerHTML = ''; rows.clear(); msgCache.clear(); chatFiles = new Map(); selectedRow = null; firstSnap = true;
  setReply(null); renderHeader(); renderContacts(); renderFiles();
  $('emptyNote').hidden = true;
  if (showChat) app$.dataset.view = 'chat';
  const q = query(msgCol(id), orderBy('createdAt', 'asc'), limitToLast(100));
  unsubMsgs = onSnapshot(q, { includeMetadataChanges: true }, snap => {
    const box = $('messages'); const near = box.scrollHeight - box.scrollTop - box.clientHeight < 180;
    let own = false;
    snap.docChanges().forEach(ch => {
      const mid = ch.doc.id;
      if (ch.type === 'removed') { rows.get(mid)?.remove(); rows.delete(mid); msgCache.delete(mid); chatFiles.delete(mid); return; }
      const m = ch.doc.data({ serverTimestamps: 'estimate' }); const pending = ch.doc.metadata.hasPendingWrites;
      msgCache.set(mid, m);
      if (m.fileUrl && m.type !== 'voice') chatFiles.set(mid, m);
      const row = buildRow(mid, m, pending);
      const old = rows.get(mid); if (old) old.remove();
      rows.set(mid, row);
      $('list').insertBefore(row, $('list').children[ch.newIndex] || null);
      if (m.uid === me.uid && ch.type === 'added') own = true;
    });
    $('emptyNote').hidden = rows.size > 0;
    if (firstSnap || near || own) { box.scrollTop = box.scrollHeight; }
    firstSnap = false;
    if ($('tab-files').classList.contains('on')) renderFiles();
  }, err => { console.error(err); toast('Chat access blocked. Publish the Firestore rules from firestore.rules.'); });
}

function previewOf(m) { return m.type === 'voice' ? '🎙 Voice note' : m.type === 'file' ? '📎 ' + (m.fileName || 'File') : (m.text || ''); }

function buildRow(id, m, pending) {
  const mine = m.uid === me.uid;
  const row = el('div', 'message-row' + (mine ? ' mine' : '')); row.dataset.id = id;
  if (!mine) { const av = el('div', 'avatar small'); paintAvatar(av, m.displayName); row.append(av); }
  const wrap = el('div', 'bubble-wrap');
  if (!mine && active.id === 'general') wrap.append(el('div', 'sender', m.displayName || 'User'));
  const b = el('div', 'bubble');
  if (m.replyTo) { const q = el('div', 'quote'); q.append(el('b', null, m.replyTo.name || ''), el('span', null, m.replyTo.text || '')); b.append(q); }
  const safe = safeUrl(m.fileUrl);
  if (m.type === 'voice' && safe) {
    const v = el('div', 'voice'); const a = document.createElement('audio'); a.controls = true; a.preload = 'metadata'; a.src = m.fileUrl; v.append(a); b.append(v);
    if (m.duration) b.append(el('div', 'meta', 'Voice note · ' + fmtDur(m.duration)));
  } else if (m.type === 'file' && safe) {
    const mt = m.mimeType || '';
    if (mt.startsWith('image/')) { const i = document.createElement('img'); i.className = 'media-img'; i.loading = 'lazy'; i.src = m.fileUrl; i.alt = m.fileName || 'Image'; i.onclick = ev => { ev.stopPropagation(); $('lightboxImg').src = m.fileUrl; $('lightbox').hidden = false; }; b.append(i); }
    else if (mt.startsWith('video/')) { const v = document.createElement('video'); v.className = 'media-video'; v.controls = true; v.preload = 'metadata'; v.playsInline = true; v.src = m.fileUrl; b.append(v); }
    else {
      const a = el('a', 'file-card'); a.href = m.fileUrl; a.target = '_blank'; a.rel = 'noopener noreferrer'; a.download = m.fileName || '';
      const i = el('span', 'ico', mt.startsWith('audio/') ? '🎵' : mt === 'application/pdf' ? '📕' : '📎'); const t = el('span');
      t.append(el('strong', null, m.fileName || 'Shared file'), el('small', null, (m.fileSize ? fmtSize(m.fileSize) + ' · ' : '') + 'Tap to open')); a.append(i, t); b.append(a);
    }
  } else { const t = el('div', 'text'); linkify(t, m.text || ''); b.append(t); }
  const ts = m.createdAt?.toDate ? fmtStamp(m.createdAt) : '';
  b.append(el('div', 'meta', (ts || 'Sending…') + (mine ? (pending ? ' 🕓' : ' ✓') : '')));
  b.onclick = ev => { if (ev.target.closest('a,audio,video,button,img')) return; selectRow(row, id, m); };
  wrap.append(b);
  const rx = m.reactions || {}; const chips = el('div', 'reactions');
  Object.entries(rx).forEach(([emo, uids]) => { if (!uids?.length) return; const c = el('button', 'chip' + (uids.includes(me.uid) ? ' mine' : ''), `${emo} ${uids.length}`); c.type = 'button'; c.onclick = () => react(id, emo); chips.append(c); });
  if (chips.children.length) wrap.append(chips);
  const act = el('div', 'actions');
  ['👍', '❤️', '😂', '😮', '🙏'].forEach(emo => { const x = el('button', null, emo); x.type = 'button'; x.onclick = () => { react(id, emo); selectRow(null); }; act.append(x); });
  const rep = el('button', 'txt', '↩ Reply'); rep.type = 'button'; rep.onclick = () => { setReply({ id, name: mine ? 'You' : (m.displayName || 'User'), text: previewOf(m).slice(0, 120) }); selectRow(null); $('messageInput').focus(); }; act.append(rep);
  if (m.text) { const cp = el('button', 'txt', 'Copy'); cp.type = 'button'; cp.onclick = async () => { try { await navigator.clipboard.writeText(m.text); toast('Copied'); } catch { toast('Copy not available'); } selectRow(null); }; act.append(cp); }
  if (mine) { const del = el('button', 'txt', '🗑 Delete'); del.type = 'button'; del.onclick = async () => { selectRow(null); if (confirm('Delete this message for everyone?')) { try { await deleteDoc(doc(msgCol(active.id), id)); } catch (e) { toast('Could not delete message'); } } }; act.append(del); }
  wrap.append(act);
  row.append(wrap);
  return row;
}
function selectRow(row) {
  if (selectedRow) selectedRow.classList.remove('sel');
  if (!row || row === selectedRow) { selectedRow = null; return; }
  row.classList.add('sel'); selectedRow = row;
}

  if (!e.target.closest('#meMenu,#meBtn')) meMenu.hidden = true;
  if (!e.target.closest('#attachMenu,#attachBtn')) $('attachMenu').hidden = true;
  if (!e.target.closest('#emojiPanel,#emojiBtn')) $('emojiPanel').hidden = true;

async function react(id, emo) {
  const m = msgCache.get(id); const has = m?.reactions?.[emo]?.includes(me.uid);
  try { await updateDoc(doc(msgCol(active.id), id), new FieldPath('reactions', emo), has ? arrayRemove(me.uid) : arrayUnion(me.uid)); } catch (e) { toast('Reaction failed'); }

const input = $('messageInput');
input.addEventListener('input', () => { input.style.height = 'auto'; input.style.height = Math.min(input.scrollHeight, 120) + 'px'; $('composer').classList.toggle('has-text', !!input.value.trim()); });

let uploadChain = Promise.resolve();
function queueUpload(file, kind = 'file', extra = {}) {
  const chatId = active.id; const reply = replyTo; if (reply) setReply(null);
  uploadChain = uploadChain.then(() => uploadAndShare(file, kind, extra, chatId, reply)).catch(() => {});
}
const useCloud = () => !!(CLOUDINARY.cloudName && CLOUDINARY.uploadPreset);
function readAsDataURL(blob) { return new Promise((res, rej) => { const r = new FileReader(); r.onload = () => res(r.result); r.onerror = rej; r.readAsDataURL(blob); }); }
async function shrinkImage(file) {
  if (!file.type.startsWith('image/') || file.type === 'image/gif' || file.type === 'image/svg+xml') return file;
  const bmp = await createImageBitmap(file).catch(() => null); if (!bmp) return file;
  let scale = Math.min(1, 1280 / Math.max(bmp.width, bmp.height)), q = .82, blob = null;
  for (let i = 0; i < 6; i++) {
    const c = document.createElement('canvas'); c.width = Math.max(1, Math.round(bmp.width * scale)); c.height = Math.max(1, Math.round(bmp.height * scale));
    c.getContext('2d').drawImage(bmp, 0, 0, c.width, c.height);
    blob = await new Promise(r => c.toBlob(r, 'image/jpeg', q));
    if (blob && blob.size <= INLINE_MAX * .9) break;
    q = Math.max(.5, q - .1); scale *= .8;
  }
  return blob ? new File([blob], file.name.replace(/\.\w+$/, '') + '.jpg', { type: 'image/jpeg' }) : file;
}
function uploadCloud(file, onProgress) {
  return new Promise((res, rej) => {
    const fd = new FormData(); fd.append('file', file); fd.append('upload_preset', CLOUDINARY.uploadPreset);
    const x = new XMLHttpRequest(); x.open('POST', `https://api.cloudinary.com/v1_1/${encodeURIComponent(CLOUDINARY.cloudName)}/auto/upload`);
    x.upload.onprogress = e => { if (e.lengthComputable) onProgress(Math.round(e.loaded / e.total * 100)); };
    x.onload = () => { try { const j = JSON.parse(x.responseText); if (x.status < 300 && j.secure_url) res(j.secure_url); else rej(new Error(j.error?.message || 'Upload failed')); } catch { rej(new Error('Upload failed')); } };
    x.onerror = () => rej(new Error('Network error')); x.send(fd);
  });
}
async function uploadAndShare(file, kind, extra, chatId, reply) {
  if (!me) return;
  const cloud = useCloud();
  if (cloud && file.size > MAX_CLOUD) { alert(`"${file.name}" is larger than 100 MB.`); return; }
  const label = (file.name || 'file').slice(0, 40);
  $('uploadBar').hidden = false; $('uploadLabel').textContent = 'Sending ' + label + '… 0%'; $('uploadFill').style.width = '0%';
  const prog = p => { $('uploadLabel').textContent = `Sending ${label}… ${p}%`; $('uploadFill').style.width = p + '%'; };
  try {
    let url, sent = file;
    if (cloud) url = await uploadCloud(file, prog);
    else {
      if (file.type.startsWith('image/')) sent = await shrinkImage(file);
      if (sent.size > INLINE_MAX) throw Object.assign(new Error('too big'), { code: 'inline' });
      prog(50); url = await readAsDataURL(sent); prog(100);
    }
    const safeName = (sent.name || 'file').replace(/[^a-zA-Z0-9._-]/g, '_').slice(0, 120) || 'shared-file';
    const data = { type: kind, fileName: safeName, fileUrl: url, mimeType: sent.type || 'application/octet-stream', fileSize: sent.size, ...extra };
    if (reply) data.replyTo = { id: reply.id, name: reply.name, text: reply.text };
    await sendMessage(chatId, data);
  } catch (e) {
    console.error(e);
    alert(e.code === 'inline' ? `"${label}" is too big for free built-in sharing (max about 600 KB; photos are shrunk automatically). For videos and larger files, add free Cloudinary keys — see the note near the top of the script.` : 'Sending failed: ' + (e.message || e));
  } finally { $('uploadBar').hidden = true; }
}

/* ---------- voice notes ---------- */
let rec = null;
$('micBtn').addEventListener('click', async () => {
  if (!navigator.mediaDevices?.getUserMedia || !window.MediaRecorder) { alert('Voice recording needs a modern browser over HTTPS.'); return; }
  try {
    const stream = await navigator.mediaDevices.getUserMedia({ audio: { echoCancellation: true, noiseSuppression: true } });
    const mime = ['audio/webm;codecs=opus', 'audio/webm', 'audio/mp4', 'audio/ogg'].find(t => MediaRecorder.isTypeSupported(t)) || '';
    const mr = new MediaRecorder(stream, { ...(mime ? { mimeType: mime } : {}), audioBitsPerSecond: 24000 });
    const r = { mr, stream, chunks: [], start: Date.now(), cancel: false, chatId: active.id, timer: null }; rec = r;
    mr.ondataavailable = ev => { if (ev.data.size) r.chunks.push(ev.data); };
    mr.onstop = () => {
      clearInterval(r.timer); stream.getTracks().forEach(t => t.stop()); $('recBar').hidden = true; $('composer').hidden = false; rec = null;
      const secs = Math.round((Date.now() - r.start) / 1000);
      if (r.cancel || !r.chunks.length || secs < 1) return;
      const type = mr.mimeType || mime || 'audio/webm'; const ext = type.includes('mp4') ? 'm4a' : type.includes('ogg') ? 'ogg' : 'webm';
      const file = new File([new Blob(r.chunks, { type })], `voice-note-${Date.now()}.${ext}`, { type });
      uploadChain = uploadChain.then(() => uploadAndShare(file, 'voice', { duration: secs }, r.chatId, null)).catch(() => {});
    };
    mr.start(); $('composer').hidden = true; $('recBar').hidden = false; $('recTime').textContent = '0:00';
    r.timer = setInterval(() => { const s = Math.floor((Date.now() - r.start) / 1000); $('recTime').textContent = fmtDur(s); if (s >= (useCloud() ? 300 : 120)) mr.stop(); }, 300);
  } catch (e) { alert('Microphone access was denied or is unavailable. Allow microphone permission in your browser settings.'); }
});
$('recCancel').addEventListener('click', () => { if (rec) { rec.cancel = true; rec.mr.stop(); } });
$('recSend').addEventListener('click', () => { if (rec) rec.mr.stop(); });

/* ---------- files tab ---------- */
function renderFiles() {
  const box = $('fileList'); box.innerHTML = '';
  const items = [...chatFiles.entries()].reverse();
  box.append(el('div', 'label', 'Shared in ' + (active.id === 'general' ? 'General room' : (active.peer?.displayName || 'this chat'))));
  if (!items.length) { box.append(el('div', 'empty', 'No files shared in this chat yet.\nUse ＋ in the message bar to share photos, videos and documents.')); return; }
  items.forEach(([id, m]) => {
    if (!safeUrl(m.fileUrl)) return;
    const a = el('a', 'file-row'); a.download = m.fileName || ''; a.href = m.fileUrl; a.target = '_blank'; a.rel = 'noopener noreferrer';
    const mt = m.mimeType || ''; const t = el('span');
    t.append(el('strong', null, m.fileName || 'File'), el('small', null, `${m.displayName || ''} · ${fmtStamp(m.createdAt)}${m.fileSize ? ' · ' + fmtSize(m.fileSize) : ''}`));
    a.append(el('span', 'ico', mt.startsWith('image/') ? '🖼️' : mt.startsWith('video/') ? '🎬' : mt.startsWith('audio/') ? '🎵' : '📄'), t); box.append(a);
  });
}

/* ---------- call history tab ---------- */
function renderCalls() {
  const box = $('callList'); if (!me) return; box.innerHTML = '';
  if (!callsData.length) { box.append(el('div', 'empty', 'No calls yet.\nOpen a private chat and tap 📞 or 🎥 to start one.')); return; }
  callsData.forEach(c => {
    const outgoing = c.callerId === me.uid; const otherId = outgoing ? c.calleeId : c.callerId;
    const name = outgoing ? c.calleeName : c.callerName;
    const missed = !outgoing && (c.status === 'missed' || c.status === 'declined') ;
    const b = el('button', 'contact');
    const av = el('div', 'avatar'); paintAvatar(av, name);
    const info = el('span', 'contact-info');
    const detail = `${outgoing ? '↗' : '↙'} ${c.type === 'video' ? 'Video' : 'Voice'} · ${fmtStamp(c.createdAt)}${c.duration ? ' · ' + fmtDur(c.duration) : c.status === 'missed' ? ' · ' + (outgoing ? 'No answer' : 'Missed') : c.status === 'declined' ? ' · Declined' : ''}`;
    const s = el('small', missed ? 'missed' : '', detail);
    info.append(el('strong', null, name || 'User'), s);
    const cb = el('span', 'callbtn', c.type === 'video' ? '🎥' : '📞');
    b.append(av, info, cb);
    b.onclick = () => { const u = users.get(otherId) || { id: otherId, displayName: name }; openChat(dmId(me.uid, otherId), u, true); };
    cb.onclick = ev => { ev.stopPropagation(); const u = users.get(otherId) || { id: otherId, displayName: name }; openChat(dmId(me.uid, otherId), u, true); startCall(c.type); };
    box.append(b);
  });
}

/* ================= CALLS (WebRTC + Firestore signaling) ================= */
let call = null, pendingIncoming = null, audioCtx = null, ringTimer = null;
const remoteV = $('remoteVideo'), localV = $('localVideo'), overlay = $('callOverlay');

function ringOnce(kind) {
  try {
    audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)(); audioCtx.resume?.();
    const now = audioCtx.currentTime; const g = audioCtx.createGain(); g.connect(audioCtx.destination);
    const freqs = kind === 'in' ? [880, 660] : [440, 480];
    freqs.forEach((f, i) => { const o = audioCtx.createOscillator(); o.type = 'sine'; o.frequency.value = f; o.connect(g); o.start(now + i * .22); o.stop(now + i * .22 + .2); });
    g.gain.setValueAtTime(.0001, now); g.gain.exponentialRampToValueAtTime(kind === 'in' ? .25 : .1, now + .03); g.gain.exponentialRampToValueAtTime(.0001, now + .5);
  } catch {}
}
function startRing(kind) { stopRing(); ringOnce(kind); ringTimer = setInterval(() => { ringOnce(kind); if (kind === 'in') navigator.vibrate?.([300, 150, 300]); }, 2200); }
function stopRing() { clearInterval(ringTimer); ringTimer = null; navigator.vibrate?.(0); }

async function getMedia(type) {
  if (!navigator.mediaDevices?.getUserMedia) throw new Error('Calls need a modern browser over HTTPS.');
  return navigator.mediaDevices.getUserMedia({ audio: { echoCancellation: true, noiseSuppression: true, autoGainControl: true }, video: type === 'video' ? { facingMode: 'user', width: { ideal: 1280 }, height: { ideal: 720 } } : false });
}
function showCallUI(type, name, status) {
  overlay.className = 'call-overlay show ' + type;
  $('callName').textContent = $('callTopName').textContent = name; paintAvatar($('callAvatar'), name);
  $('callStatus').textContent = $('callTopStatus').textContent = status;
  $('muteBtn').classList.remove('off'); $('camBtn').classList.remove('off'); $('screenBtn').classList.remove('off');
  $('screenBtn').hidden = !navigator.mediaDevices?.getDisplayMedia;
  localV.srcObject = call?.stream || null;
}
function setCallStatus(t) { $('callStatus').textContent = $('callTopStatus').textContent = t; }

function makePC(c) {
  const pc = new RTCPeerConnection(ICE); c.pc = pc;
  c.stream.getTracks().forEach(t => pc.addTrack(t, c.stream));
  pc.ontrack = e => {
    remoteV.srcObject = e.streams[0]; remoteV.play?.().catch(() => {});
    if (e.track.kind === 'video') { overlay.classList.add('remote-on'); }
  };
  pc.onconnectionstatechange = () => {
    if (call !== c) return;
    const s = pc.connectionState;
    if (s === 'connected') {
      if (!c.connectedAt) { c.connectedAt = Date.now(); stopRing(); clearTimeout(c.ringTimeout); c.timer = setInterval(() => setCallStatus(fmtDur((Date.now() - c.connectedAt) / 1000)), 1000); }
      setCallStatus('Connected');
    } else if (s === 'disconnected') setCallStatus('Reconnecting…');
    else if (s === 'failed') { toast('Call connection failed. Try again, or configure a TURN server.'); endCall(true); }
  };
  return pc;
}
function addCand(c, cand) { if (!c.pc || !c.pc.remoteDescription) c.pending.push(cand); else c.pc.addIceCandidate(cand).catch(() => {}); }
function flushCands(c) { c.pending.splice(0).forEach(x => c.pc.addIceCandidate(x).catch(() => {})); }
function watchCandidates(c, sub) {
  c.unsubs.push(onSnapshot(collection(c.ref, sub), s => s.docChanges().forEach(ch => { if (ch.type === 'added') addCand(c, new RTCIceCandidate(ch.doc.data())); })));
}
function watchCall(c) {
  c.unsubs.push(onSnapshot(c.ref, async s => {
    const d = s.data(); if (!d || call !== c) return;
    if (c.role === 'caller' && d.answer && !c.pc.currentRemoteDescription) {
      try { await c.pc.setRemoteDescription(d.answer); flushCands(c); setCallStatus('Connecting…'); stopRing(); } catch (e) { console.error(e); }
    }
    if (['ended', 'missed', 'declined'].includes(d.status)) endCall(false, d.status);
  }));
}

async function startCall(type) {
  if (!me || active.id === 'general' || !active.peer) { toast('Open a private chat to start a call'); return; }
  if (call || pendingIncoming) { toast('You are already in a call'); return; }
  const peer = active.peer; const peerName = peer.displayName || 'User';
  const c = { role: 'caller', type, peer, unsubs: [], pending: [] }; call = c;
  try { c.stream = await getMedia(type); }
  catch (e) { call = null; alert(e.name === 'NotAllowedError' ? 'Allow microphone' + (type === 'video' ? ' and camera' : '') + ' access to make calls.' : (e.message || 'Could not access your microphone/camera.')); return; }
  showCallUI(type, peerName, 'Calling…'); startRing('out');
  try {
    c.ref = doc(collection(db, 'calls')); c.id = c.ref.id;
    const pc = makePC(c);
    pc.onicecandidate = e => { if (e.candidate && call === c) addDoc(collection(c.ref, 'callerCandidates'), e.candidate.toJSON()).catch(() => {}); };
    const offer = await pc.createOffer();
    await setDoc(c.ref, { callerId: me.uid, callerName: me.displayName || me.email, calleeId: peer.id, calleeName: peerName, participants: [me.uid, peer.id], type, status: 'ringing', offer: { type: offer.type, sdp: offer.sdp }, createdAt: serverTimestamp() });
    await pc.setLocalDescription(offer);
    watchCall(c); watchCandidates(c, 'calleeCandidates');
    c.ringTimeout = setTimeout(() => { if (call === c && !c.connectedAt) { toast(peerName + ' did not answer'); endCall(true); } }, 45000);
  } catch (e) { console.error(e); toast('Could not start the call. Check Firestore rules.'); endCall(false); }
}

function listenIncoming() {
  const q = query(collection(db, 'calls'), where('participants', 'array-contains', me.uid), where('status', '==', 'ringing'));
  unsubIncoming = onSnapshot(q, snap => snap.docChanges().forEach(ch => {
    const d = ch.doc.data();
    if (ch.type === 'removed') { if (pendingIncoming?.id === ch.doc.id) hideIncoming(); return; }
    if (d.calleeId !== me.uid || ch.type !== 'added') return;
    const age = Date.now() - (d.createdAt?.toMillis?.() || Date.now()); if (age > 60000) return;
    if (call || pendingIncoming) { updateDoc(ch.doc.ref, { status: 'declined' }).catch(() => {}); return; }
    pendingIncoming = { id: ch.doc.id, ref: ch.doc.ref, data: d };
    paintAvatar($('incAvatar'), d.callerName); $('incName').textContent = d.callerName || 'Someone';
    $('incType').textContent = d.type === 'video' ? 'Incoming video call…' : 'Incoming voice call…';
    $('incoming').hidden = false; startRing('in');
    if ('Notification' in window && Notification.permission === 'granted' && document.hidden) { try { new Notification('TEAM-UP — incoming call', { body: (d.callerName || 'Someone') + ' is calling you', tag: 'call' }); } catch {} }
  }), err => console.warn('incoming', err.code));
}
function hideIncoming() { $('incoming').hidden = true; pendingIncoming = null; if (!call) stopRing(); }

$('declineBtn').addEventListener('click', () => { const p = pendingIncoming; hideIncoming(); if (p) updateDoc(p.ref, { status: 'declined' }).catch(() => {}); });
$('acceptBtn').addEventListener('click', async () => {
  const p = pendingIncoming; if (!p) return; const d = p.data;
  $('incoming').hidden = true; pendingIncoming = null; stopRing();
  const c = { role: 'callee', type: d.type, peer: { id: d.callerId, displayName: d.callerName }, ref: p.ref, id: p.id, unsubs: [], pending: [] }; call = c;
  try { c.stream = await getMedia(d.type); }
  catch (e) { call = null; updateDoc(p.ref, { status: 'declined' }).catch(() => {}); alert('Allow microphone' + (d.type === 'video' ? ' and camera' : '') + ' access to answer calls.'); return; }
  showCallUI(d.type, d.callerName || 'Caller', 'Connecting…');
  try {
    const pc = makePC(c);
    pc.onicecandidate = e => { if (e.candidate && call === c) addDoc(collection(c.ref, 'calleeCandidates'), e.candidate.toJSON()).catch(() => {}); };
    await pc.setRemoteDescription(d.offer); flushCands(c);
    const answer = await pc.createAnswer(); await pc.setLocalDescription(answer);
    await updateDoc(c.ref, { answer: { type: answer.type, sdp: answer.sdp }, status: 'active' });
    watchCandidates(c, 'callerCandidates'); watchCall(c);
  } catch (e) { console.error(e); toast('Could not connect the call.'); endCall(true); }
});

function endCall(notifyRemote, remoteStatus) {
  const c = call; if (!c) return; call = null;
  clearTimeout(c.ringTimeout); clearInterval(c.timer); stopRing();
  c.unsubs.forEach(u => { try { u(); } catch {} });
  try { c.pc?.close(); } catch {}
  c.stream?.getTracks().forEach(t => t.stop()); c.screen?.getTracks().forEach(t => t.stop());
  remoteV.srcObject = null; localV.srcObject = null; overlay.className = 'call-overlay';
  if (notifyRemote && c.ref) {
    const dur = c.connectedAt ? Math.round((Date.now() - c.connectedAt) / 1000) : 0;
    const status = c.connectedAt ? 'ended' : (c.role === 'caller' ? 'missed' : 'declined');
    updateDoc(c.ref, { status, endedAt: serverTimestamp(), duration: dur }).catch(() => {});
  }
  const msg = remoteStatus === 'declined' ? 'Call declined' : remoteStatus === 'missed' ? 'Call cancelled' : 'Call ended';
  if (notifyRemote !== false || remoteStatus) toast(msg + (c.connectedAt ? ' · ' + fmtDur((Date.now() - c.connectedAt) / 1000) : ''));
}

$('hangBtn').addEventListener('click', () => endCall(true));
$('muteBtn').addEventListener('click', () => { if (!call) return; const t = call.stream.getAudioTracks()[0]; if (!t) return; t.enabled = !t.enabled; $('muteBtn').classList.toggle('off', !t.enabled); $('muteBtn').textContent = t.enabled ? '🎤' : '🔇'; });
$('camBtn').addEventListener('click', () => { if (!call) return; const t = call.stream.getVideoTracks()[0]; if (!t) return; t.enabled = !t.enabled; $('camBtn').classList.toggle('off', !t.enabled); });
$('screenBtn').addEventListener('click', async () => {
  if (!call || call.type !== 'video') return;
  const sender = call.pc.getSenders().find(s => s.track?.kind === 'video'); if (!sender) return;
  if (call.screen) { stopShare(); return; }
  try {
    const s = await navigator.mediaDevices.getDisplayMedia({ video: true }); const track = s.getVideoTracks()[0];
    await sender.replaceTrack(track); call.screen = s; localV.srcObject = s; $('screenBtn').classList.add('off'); track.onended = stopShare;
  } catch {}
});
function stopShare() {
  if (!call?.screen) return; const sender = call.pc.getSenders().find(s => s.track?.kind === 'video' || s.track === null);
  const cam = call.stream.getVideoTracks()[0]; if (sender && cam) sender.replaceTrack(cam).catch(() => {});
  call.screen.getTracks().forEach(t => t.stop()); call.screen = null; localV.srcObject = call.stream; $('screenBtn').classList.remove('off');
}
$('voiceCall').addEventListener('click', () => startCall('audio'));
$('videoCall').addEventListener('click', () => startCall('video'));
window.addEventListener('beforeunload', () => { if (call?.ref) { updateDoc(call.ref, { status: 'ended' }).catch(() => {}); } });
</script>
